# Drawing-Battle Supabase config
project_id = "drawing-battle"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
enable_anonymous_sign_ins = true
additional_redirect_urls = [
  "http://localhost:8081",
  "exp://localhost:8081",
  "drawingbattle://auth/callback",
  "drawingbattle://*",
]

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.judge-match]
verify_jwt = true
